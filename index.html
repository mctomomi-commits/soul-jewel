  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --c-bg: #0a0015;
      --c-surface: rgba(255,255,255,0.05);
      --c-border: rgba(255,255,255,0.12);
      --c-text: #f0eaff;
      --c-muted: rgba(240,234,255,0.6);
      --c-accent: #c084fc;
      --c-gold: #fbbf24;
      --c-line: #06C755;
      --radius: 16px;
    }

    body {
      font-family: 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
      background: var(--c-bg);
      color: var(--c-text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ─── 背景装飾 ─── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 20% 10%, rgba(192,132,252,0.18) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 80%, rgba(251,191,36,0.10) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 680px;
      padding: 24px 16px 64px;
    }

    /* ─── ヘッダー ─── */
    .site-header {
      text-align: center;
      margin-bottom: 48px;
      padding-top: 16px;
    }
    .site-header .gem-icon { font-size: 48px; line-height: 1; margin-bottom: 12px; }
    .site-header h1 {
      font-size: clamp(26px, 6vw, 36px);
      font-weight: 700;
      letter-spacing: 0.05em;
      background: linear-gradient(135deg, #e9d5ff 0%, #fbbf24 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .site-header .tagline {
      margin-top: 8px;
      color: var(--c-muted);
      font-size: 14px;
    }

    /* ─── カード ─── */
    .card {
      background: var(--c-surface);
      border: 1px solid var(--c-border);
      border-radius: var(--radius);
      padding: 32px 28px;
      backdrop-filter: blur(12px);
    }

    .card h2 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 24px;
      color: var(--c-accent);
    }

    /* ─── フォーム ─── */
    .form-group { margin-bottom: 20px; }
    .form-group label {
      display: block;
      font-size: 13px;
      color: var(--c-muted);
      margin-bottom: 6px;
      letter-spacing: 0.04em;
    }
    .form-group input {
      width: 100%;
      padding: 12px 16px;
      background: rgba(255,255,255,0.07);
      border: 1px solid var(--c-border);
      border-radius: 10px;
      color: var(--c-text);
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-group input:focus { border-color: var(--c-accent); }
    .form-group input::-webkit-calendar-picker-indicator { filter: invert(1) opacity(0.5); }

    .btn-primary {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #7c3aed, #c084fc);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.04em;
      transition: opacity 0.2s, transform 0.1s;
      margin-top: 8px;
    }
    .btn-primary:hover { opacity: 0.88; }
    .btn-primary:active { transform: scale(0.98); }

    /* ─── 結果 ─── */
    #result-section { display: none; }

    .result-card {
      background: linear-gradient(135deg, rgba(124,58,237,0.25), rgba(251,191,36,0.15));
      border: 1px solid rgba(192,132,252,0.4);
      border-radius: 20px;
      padding: 36px 28px;
      text-align: center;
      margin-bottom: 24px;
    }

    .result-name {
      font-size: 13px;
      color: var(--c-muted);
      margin-bottom: 4px;
    }

    .result-jewel {
      font-size: clamp(32px, 8vw, 48px);
      font-weight: 700;
      background: linear-gradient(135deg, #e9d5ff 0%, #fbbf24 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 6px;
    }

    .result-sub {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      font-size: 13px;
      color: var(--c-muted);
      margin-bottom: 20px;
    }
    .result-sub span {
      background: rgba(255,255,255,0.08);
      border-radius: 99px;
      padding: 4px 12px;
    }

    .result-desc {
      font-size: 15px;
      line-height: 1.8;
      color: var(--c-text);
      text-align: left;
    }

    /* ─── シェアボタン ─── */
    .share-section { margin-top: 8px; }
    .share-section h3 {
      font-size: 14px;
      color: var(--c-muted);
      margin-bottom: 14px;
      text-align: center;
    }

    .share-buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn-share {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border: none;
      border-radius: 10px;
      padding: 12px 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      min-height: 44px;
      transition: opacity 0.2s, transform 0.1s;
      white-space: nowrap;
    }
    .btn-share:hover { opacity: 0.85; }
    .btn-share:active { transform: scale(0.97); }

    .btn-twitter {
      background: #000;
      color: #fff;
    }
    .btn-line {
      background: var(--c-line);
      color: #fff;
    }
    .btn-copy {
      background: rgba(255,255,255,0.12);
      color: var(--c-text);
      border: 1px solid var(--c-border);
    }

    .btn-share svg { flex-shrink: 0; }

    .copy-toast {
      display: none;
      text-align: center;
      font-size: 13px;
      color: var(--c-accent);
      margin-top: 10px;
    }

    /* ─── もう一度 ─── */
    .btn-retry {
      display: block;
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      background: transparent;
      color: var(--c-muted);
      border: 1px solid var(--c-border);
      border-radius: 12px;
      font-size: 15px;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }
    .btn-retry:hover { border-color: var(--c-accent); color: var(--c-accent); }

    /* ─── フッター ─── */
    footer {
      text-align: center;
      color: var(--c-muted);
      font-size: 12px;
      margin-top: 48px;
      padding-bottom: 24px;
    }

    @media (max-width: 400px) {
      .card { padding: 24px 18px; }
      .share-buttons { flex-direction: column; align-items: stretch; }
      .btn-share { justify-content: center; }
    }
  </style>
</head>
<body>
<div class="container">

  <!-- ヘッダー -->
  <header class="site-header">
    <div class="gem-icon">💎</div>
    <h1>Soul Jewel 診断</h1>
    <p class="tagline">生年月日からあなたの魂のジュエルを発見</p>
  </header>

  <!-- 入力フォーム -->
  <section id="form-section" class="card">
    <h2>✨ 診断スタート</h2>

    <div class="form-group">
      <label for="input-name">お名前（ニックネームOK）</label>
      <input type="text" id="input-name" placeholder="さくら" maxlength="20" />
    </div>

    <div class="form-group">
      <label for="input-birthdate">生年月日</label>
      <input type="date" id="input-birthdate" />
    </div>

    <button class="btn-primary" onclick="diagnose()">🔮 今すぐ診断する</button>
  </section>

  <!-- 診断結果 -->
  <section id="result-section">

    <div class="result-card">
      <p class="result-name" id="res-name"></p>
      <div class="result-jewel" id="res-jewel"></div>
      <div class="result-sub">
        <span id="res-zodiac"></span>
        <span id="res-kyusei"></span>
      </div>
      <p class="result-desc" id="res-desc"></p>
    </div>

    <!-- シェアセクション -->
    <div class="card share-section">
      <h3>✉ 結果をシェアする</h3>
      <div class="share-buttons">

        <!-- X（Twitter）でシェア -->
        <a id="btn-twitter" class="btn-share btn-twitter" href="#" target="_blank" rel="noopener noreferrer">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.744l7.73-8.835L2.25 2.25h6.894l4.266 5.638L18.244 2.25zm-1.161 17.52h1.833L7.084 4.126H5.117L17.083 19.77z"/>
          </svg>
          X でシェア
        </a>

        <!-- LINEで送る -->
        <a id="btn-line" class="btn-share btn-line" href="#" target="_blank" rel="noopener noreferrer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
            <path d="M19.365 9.863c.349 0 .63.285.63.631 0 .345-.281.63-.63.63H17.61v1.125h1.755c.349 0 .63.283.63.63 0 .344-.281.629-.63.629h-2.386c-.345 0-.627-.285-.627-.629V8.108c0-.345.282-.63.627-.63h2.386c.349 0 .63.285.63.63 0 .349-.281.63-.63.63H17.61v1.125h1.755zm-3.855 3.016c0 .27-.174.51-.432.596-.064.021-.133.031-.199.031-.211 0-.391-.09-.51-.25l-2.443-3.317v2.94c0 .344-.279.629-.631.629-.346 0-.626-.285-.626-.629V8.108c0-.27.173-.51.43-.595.06-.023.136-.033.194-.033.195 0 .375.105.495.254l2.462 3.33V8.108c0-.345.282-.63.63-.63.345 0 .63.285.63.63v4.771zm-5.741 0c0 .344-.282.629-.631.629-.345 0-.627-.285-.627-.629V8.108c0-.345.282-.63.627-.63.349 0 .631.285.631.63v4.771zm-2.466.629H4.917c-.345 0-.63-.285-.63-.629V8.108c0-.345.285-.63.63-.63.348 0 .63.285.63.63v4.141h1.756c.348 0 .629.283.629.63 0 .344-.281.629-.629.629M24 10.314C24 4.943 18.615.572 12 .572S0 4.943 0 10.314c0 4.811 4.27 8.842 10.035 9.608.391.082.923.258 1.058.59.12.301.079.766.038 1.08l-.164 1.02c-.045.301-.24 1.186 1.049.645 1.291-.539 6.916-4.070 9.436-6.975C23.176 14.393 24 12.458 24 10.314"/>
          </svg>
          LINEで送る
        </a>

        <!-- URLをコピー -->
        <button class="btn-share btn-copy" onclick="copyURL()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="9" y="9" width="13" height="13" rx="2"/>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
          コピー
        </button>

      </div>
      <p class="copy-toast" id="copy-toast">URLをコピーしました！</p>
    </div>

    <button class="btn-retry" onclick="resetForm()">↩ もう一度診断する</button>
  </section>

</div>

<footer>
  <p>© 2025 Soul Jewel診断</p>
</footer>

<script>
// ─── データ定義 ───────────────────────────────────────────────

const JEWELS = {
  "ダイヤモンド": {
    emoji: "💎",
    desc: "あなたの魂はダイヤモンドのように輝いています。\n強い意志と透明な心を持ち、どんな逆境も乗り越えるパワーがあります。リーダーシップを発揮し、周囲に光をもたらす存在です。",
    color: "#e9d5ff"
  },
  "ルビー": {
    emoji: "❤️‍🔥",
    desc: "あなたの魂はルビーのように情熱的です。\n情熱と行動力で夢を現実に変える力があります。愛情深く、周囲の人を引きつける強い魅力があります。",
    color: "#f87171"
  },
  "エメラルド": {
    emoji: "💚",
    desc: "あなたの魂はエメラルドのように深く豊かです。\n癒しと調和の力を持ち、自然や人との繋がりを大切にします。直感が鋭く、物事の本質を見抜く力があります。",
    color: "#34d399"
  },
  "サファイア": {
    emoji: "💙",
    desc: "あなたの魂はサファイアのように澄んでいます。\n知性と冷静さで真実を追い求めます。信頼と誠実さを大切にし、長期的な視野で物事を捉える力があります。",
    color: "#60a5fa"
  },
  "アメジスト": {
    emoji: "💜",
    desc: "あなたの魂はアメジストのように神秘的です。\n精神性が高く、直感と霊感に優れています。創造性豊かで、アートや音楽など感性の世界で力を発揮します。",
    color: "#a78bfa"
  },
  "トパーズ": {
    emoji: "💛",
    desc: "あなたの魂はトパーズのように温かく輝いています。\n明るさと楽観性で周囲を笑顔にします。コミュニケーション能力が高く、人と人を繋ぐ架け橋になります。",
    color: "#fbbf24"
  },
  "オパール": {
    emoji: "🌈",
    desc: "あなたの魂はオパールのように多彩に輝いています。\n変幻自在な適応力と豊かな感受性を持ちます。多面的な才能があり、様々な分野で輝きを放ちます。",
    color: "#f0abfc"
  },
  "ガーネット": {
    emoji: "🔴",
    desc: "あなたの魂はガーネットのように深く情熱的です。\n強い意志と継続力で目標を達成します。家族や大切な人への愛情が深く、その絆を何より大切にします。",
    color: "#fb7185"
  },
  "アクアマリン": {
    emoji: "🩵",
    desc: "あなたの魂はアクアマリンのように清らかです。\n柔軟性と包容力があり、周囲を和やかな雰囲気にします。感受性が豊かで、人の気持ちに寄り添う力があります。",
    color: "#67e8f9"
  }
};

const ZODIACS = [
  "山羊座","水瓶座","魚座","牡羊座","牡牛座","双子座",
  "蟹座","獅子座","乙女座","天秤座","蠍座","射手座"
];

const KYUSEI = [
  "一白水星","二黒土星","三碧木星","四緑木星","五黄土星",
  "六白金星","七赤金星","八白土星","九紫火星"
];

const JEWEL_NAMES = Object.keys(JEWELS);

// ─── 計算ロジック ─────────────────────────────────────────────

function getZodiac(month, day) {
  const dates = [20,19,21,20,21,22,23,23,23,24,23,22];
  const idx = day <= dates[month - 1] ? month - 1 : month;
  return ZODIACS[idx % 12];
}

function getKyusei(year, month, day) {
  // 節入り（立春：2月4日）より前は前年扱い
  const effectiveYear = (month === 1 || (month === 2 && day < 4)) ? year - 1 : year;
  // year % 9 → KYUSEI配列インデックスの対応（unkoi.com早見表準拠）
  const MAP = [1, 0, 8, 7, 6, 5, 4, 3, 2]; // r=0→二黒, r=1→一白, r=2→九紫...
  return KYUSEI[MAP[effectiveYear % 9]];
}

function getJewel(year, month, day) {
  const seed = (year * 13 + month * 7 + day * 3) % JEWEL_NAMES.length;
  return JEWEL_NAMES[seed];
}

// ─── 診断処理 ─────────────────────────────────────────────────

function diagnose() {
  const name = document.getElementById('input-name').value.trim() || "あなた";
  const birthdate = document.getElementById('input-birthdate').value;

  if (!birthdate) {
    alert('生年月日を入力してください');
    return;
  }

  const [year, month, day] = birthdate.split('-').map(Number);
  const jewel = getJewel(year, month, day);
  const zodiac = getZodiac(month, day);
  const kyusei = getKyusei(year, month, day);

  showResult({ name, jewel, zodiac, kyusei });

  // URLパラメータを更新（ページ遷移なし）
  const params = new URLSearchParams({
    jewel, zodiac, kyusei,
    name: encodeURIComponent(name)
  });
  window.history.pushState({}, '', '?' + params.toString());

  // シェアボタンのURLを更新
  updateShareButtons();
}

function showResult({ name, jewel, zodiac, kyusei }) {
  const data = JEWELS[jewel];

  document.getElementById('res-name').textContent = `${name} さんの魂のジュエル`;
  document.getElementById('res-jewel').textContent = `${data.emoji} ${jewel}`;
  document.getElementById('res-zodiac').textContent = zodiac;
  document.getElementById('res-kyusei').textContent = kyusei;
  document.getElementById('res-desc').textContent = data.desc;

  document.getElementById('form-section').style.display = 'none';
  document.getElementById('result-section').style.display = 'block';

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function updateShareButtons() {
  const url = encodeURIComponent(location.href);
  const params = new URLSearchParams(location.search);
  const jewel = params.get('jewel') || '';
  const name = decodeURIComponent(params.get('name') || '');

  const text = encodeURIComponent(
    `✨ 私の魂のジュエルは「${jewel}」でした！\nあなたも診断してみて👇`
  );

  document.getElementById('btn-twitter').href =
    `https://twitter.com/intent/tweet?text=${text}&url=${url}`;

  document.getElementById('btn-line').href =
    `https://social-plugins.line.me/lineit/share?url=${url}`;
}

function copyURL() {
  navigator.clipboard.writeText(location.href).then(() => {
    const toast = document.getElementById('copy-toast');
    toast.style.display = 'block';
    setTimeout(() => { toast.style.display = 'none'; }, 2500);
  }).catch(() => {
    // フォールバック
    const ta = document.createElement('textarea');
    ta.value = location.href;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    const toast = document.getElementById('copy-toast');
    toast.style.display = 'block';
    setTimeout(() => { toast.style.display = 'none'; }, 2500);
  });
}

function resetForm() {
  document.getElementById('result-section').style.display = 'none';
  document.getElementById('form-section').style.display = 'block';
  window.history.pushState({}, '', location.pathname);
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ─── URLパラメータから結果を復元 ──────────────────────────────

(function restoreFromURL() {
  const params = new URLSearchParams(location.search);
  const jewel  = params.get('jewel');
  const zodiac = params.get('zodiac');
  const kyusei = params.get('kyusei');
  const name   = decodeURIComponent(params.get('name') || '');

  if (jewel && zodiac && kyusei && JEWELS[jewel]) {
    showResult({ name: name || 'あなた', jewel, zodiac, kyusei });
    updateShareButtons();
  }
})();
</script>
</body>
</html>
